[workspace]
members = [
    "crates/pytecode-engine",
    "crates/pytecode-archive",
    "crates/pytecode-cli",
    "crates/pytecode-python",
]
resolver = "2"
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "MIT"
homepage = "https://github.com/smithtrenton/pytecode"
repository = "https://github.com/smithtrenton/pytecode"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[workspace.dependencies]
assert_cmd = "2.2.0"
bitflags = "2.13.1"
clap = { version = "4.6.6", features = ["derive"] }
pyo3 = { version = "0.29.2", features = ["abi3-py312"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tempfile = "3.27.0"
walkdir = "2.5.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate", "unreserved"] }
