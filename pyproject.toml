[build-system]
requires = ["maturin>=1.15.0,<2.0.0"]
build-backend = "maturin"

[project]
name = "pytecode"
version = "0.1.0"
description = "Python library for parsing, manipulating, and emitting JVM class files"
readme = "README.md"
authors = [{ name = "Trenton Smith" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["bytecode", "classfile", "java", "jvm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/smithtrenton/pytecode"
Documentation = "https://smithtrenton.github.io/pytecode/"
Repository = "https://github.com/smithtrenton/pytecode"
Issues = "https://github.com/smithtrenton/pytecode/issues"
Changelog = "https://github.com/smithtrenton/pytecode/releases"

[project.optional-dependencies]
dev = [
  "basedpyright>=1.39.10,<2.0.0",
  "maturin>=1.15.0,<2.0.0",
  "pdoc>=16.0.0,<17.0.0",
  "pytest>=9.1.1,<10.0.0",
  "ruff>=0.16.6,<0.17.0",
]

[tool.maturin]
locked = true
# Preserve all workspace members so the shipped Cargo.lock remains usable.
sdist-generator = "git"
manifest-path = "crates/pytecode-python/Cargo.toml"
python-source = "."
module-name = "pytecode._rust"
include = [
  "pytecode/*.pyi",
  "pytecode/py.typed",
  { path = "rust-toolchain.toml", format = "sdist" },
]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["pytecode", "run.py", "tools", "tests"]
exclude = ["output", "venv", ".venv"]
reportMissingTypeStubs = false
reportPrivateUsage = false

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
  "output",
  "venv",
  ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
required-version = ">=0.12.10"
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "Cargo.lock" },
  { file = "rust-toolchain.toml" },
  { file = "crates/**/Cargo.toml" },
  { file = "crates/**/*.rs" },
  { file = "pytecode/**/*.py" },
  { file = "pytecode/**/*.pyi" },
]
