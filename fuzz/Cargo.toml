[package]
name = "pytecode-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
pytecode-engine = { path = "../crates/pytecode-engine" }

[workspace]
members = ["."]

[[bin]]
name = "class_parse"
path = "fuzz_targets/class_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "model_lift"
path = "fuzz_targets/model_lift.rs"
test = false
doc = false
bench = false

[[bin]]
name = "verify_bounded"
path = "fuzz_targets/verify_bounded.rs"
test = false
doc = false
bench = false
