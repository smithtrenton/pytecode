name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

env:
  PYTHON_VERSION: "3.12"
  JAVA_VERSION: "25"
  RUST_TOOLCHAIN: "1.98.1"
  PROPTEST_RNG_SEED: "20260904"

jobs:
  checks:
    name: Build, lint, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.10"
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-python: true
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run Rust tests
        run: cargo test --workspace --locked
      - name: Sync dependencies
        run: uv sync --locked --extra dev --python ${{ env.PYTHON_VERSION }}
      - name: Record build provenance
        run: |
          rustc --version
          uv --version
          java -version
          uv run --no-sync python -c "import sys, pytecode._rust; print(sys.version); print(pytecode._rust.__file__)"
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Check formatting
        run: uv run --no-sync ruff format --check .
      - name: Type-check
        run: uv run --no-sync basedpyright
      - name: Run pytest
        run: uv run --no-sync pytest -q
      - name: Generate API docs
        run: uv run --no-sync python tools/generate_api_docs.py
      - name: Upload API docs artifact
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-artifact@v7
        with:
          name: github-pages-docs
          path: docs/api
          if-no-files-found: error

  platforms:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.14"
          - os: macos-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.10"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: uv sync --locked --extra dev --python ${{ matrix.python }}
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync python tools/generate_api_docs.py --check

  msrv:
    name: Minimum Rust 1.94
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.10"
          python-version: "3.12"
      - run: cargo +1.94.0 check --workspace --locked

  java26:
    name: Java 26 runtime compatibility
    runs-on: ubuntu-latest
    env:
      PYTECODE_TEST_JAVA26: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.10"
          python-version: "3.14"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "26"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
      - run: uv sync --locked --extra dev --python 3.14
      - run: uv run --no-sync pytest tests/test_java26.py tests/test_frame_semantics.py tests/test_java_strings.py -q

  deploy-pages:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: [checks, platforms, msrv, java26]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Download API docs artifact
        uses: actions/download-artifact@v8
        with:
          name: github-pages-docs
          path: docs/api
      - name: Disable Jekyll processing
        run: touch docs/api/.nojekyll
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/api
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
